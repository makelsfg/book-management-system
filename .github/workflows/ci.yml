name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server-test:
    name: 后端接口与单元测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: book_manage
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/book_manage
      SESSION_SECRET: ci-session-secret

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装后端依赖
        working-directory: server
        run: npm ci

      - name: 生成 Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: 执行数据库迁移
        working-directory: server
        run: npx prisma migrate deploy

      - name: 灌入种子数据
        working-directory: server
        run: npm run seed

      - name: 运行测试
        working-directory: server
        run: npm test

  client-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 构建前端
        working-directory: client
        run: npm run build
